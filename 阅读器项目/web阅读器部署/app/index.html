<!DOCTYPE html>
<html lang="zh-CN" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>微阅读 · 网页阅读器</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 书架 -->
<section id="shelf" class="view active">
  <header class="shelf-head">
    <div>
      <p class="eyebrow">WEB READER</p>
      <h1>我的书架</h1>
    </div>
    <span class="pill" id="shelf-count">0 本</span>
  </header>

  <div id="continue-card" class="continue hidden">
    <div class="continue-info">
      <p class="eyebrow">继续阅读</p>
      <h2 id="continue-title"></h2>
      <p id="continue-sub" class="muted"></p>
      <div class="bar"><i id="continue-bar"></i></div>
    </div>
    <button class="btn-primary" id="continue-btn">继续</button>
  </div>

  <div id="book-grid" class="book-grid"></div>

  <footer class="shelf-foot">
    <p>进度与划线保存在本机浏览器（localStorage），不上传服务器。</p>
  </footer>
</section>

<!-- 阅读页 -->
<section id="reader" class="view">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="back-btn" aria-label="返回书架">←</button>
    <div class="topbar-title">
      <strong id="book-name"></strong>
      <small id="chapter-name"></small>
    </div>
    <button class="icon-btn" id="toc-btn" aria-label="目录">☰</button>
    <button class="icon-btn" id="set-btn" aria-label="设置">Aa</button>
  </header>

  <main id="content" class="content" tabindex="0">
    <article id="article"></article>
    <nav class="chapter-nav">
      <button id="prev-btn" class="nav-btn">上一章</button>
      <button id="next-btn" class="nav-btn">下一章</button>
    </nav>
  </main>

  <footer class="bottombar" id="bottombar">
    <span id="chapter-progress">第 1 / 120 章</span>
    <span class="bar slim"><i id="read-bar"></i></span>
    <span id="read-percent">0.8%</span>
  </footer>

  <!-- 目录 / 划线 -->
  <aside class="drawer" id="drawer">
    <div class="drawer-tabs">
      <button class="tab active" data-tab="toc">目录</button>
      <button class="tab" data-tab="marks">划线 <em id="mark-count">0</em></button>
      <button class="icon-btn drawer-close" id="drawer-close">✕</button>
    </div>
    <div class="drawer-body" id="toc-list"></div>
    <div class="drawer-body hidden" id="mark-list"></div>
  </aside>
  <div class="mask" id="mask"></div>

  <!-- 阅读设置 -->
  <div class="sheet" id="settings">
    <div class="sheet-row">
      <span class="sheet-label">字号</span>
      <div class="stepper">
        <button id="font-minus">A−</button>
        <span id="font-size-label">18</span>
        <button id="font-plus">A+</button>
      </div>
    </div>
    <div class="sheet-row">
      <span class="sheet-label">字重</span>
      <div class="seg" id="weight-seg">
        <button data-weight="300">细</button>
        <button data-weight="400">常规</button>
        <button data-weight="500">中粗</button>
        <button data-weight="700">粗</button>
      </div>
    </div>
    <div class="sheet-row">
      <span class="sheet-label">行距</span>
      <div class="seg" id="leading-seg">
        <button data-leading="1.6">紧凑</button>
        <button data-leading="1.85">标准</button>
        <button data-leading="2.15">宽松</button>
      </div>
    </div>
    <div class="sheet-row">
      <span class="sheet-label">主题</span>
      <div class="themes" id="theme-seg">
        <button data-theme="paper" class="theme-dot t-paper" title="纸黄"></button>
        <button data-theme="green" class="theme-dot t-green" title="护眼"></button>
        <button data-theme="night" class="theme-dot t-night" title="夜间"></button>
        <button data-theme="black" class="theme-dot t-black" title="纯黑"></button>
      </div>
    </div>
    <p class="sheet-tip">字重依赖设备字体：手机/电脑装有思源黑体、苹方或微软雅黑时档位差异更明显。</p>
  </div>

  <!-- 选中文字后的操作条 -->
  <div class="select-bar hidden" id="select-bar">
    <button id="mark-btn">划线</button>
    <button id="copy-btn">复制</button>
  </div>

  <div class="toast hidden" id="toast"></div>
</section>

<script src="./app.js"></script>
</body>
</html>
